name: Bug report / 问题反馈
description: Report a reproducible problem with MiniClaw
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "请先删除 API Key、个人路径与会话内容。安全问题请参照 SECURITY.md。"
  - type: input
    id: environment
    attributes:
      label: Environment / 环境
      description: Operating system, Python version and commit or release
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Include the smallest command or example that reproduces the issue
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior / 预期与实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted error output / 脱敏错误信息
