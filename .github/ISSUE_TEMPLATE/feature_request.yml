name: Feature request / 功能建议
description: Propose an improvement with a concrete use case
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case / 使用场景
      description: Describe the task that is difficult with the current implementation
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 建议行为
      description: Explain expected behavior and relevant permission or recovery boundaries
    validations:
      required: true
